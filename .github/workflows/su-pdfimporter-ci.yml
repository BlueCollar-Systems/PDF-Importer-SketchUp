name: su-pdfimporter-ci

on:
  push:
    branches:
      - main
      - master
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  ruby22-exact-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install exact-Ruby source build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential curl
      - name: Exact Ruby 2.2.4-p230 parse gate — every shipped extension file
        run: bash tools/run_ruby22_exact_source.sh --parse

  syntax-check:
    needs: ruby22-exact-parse
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['2.7', '3.2']
    steps:
      - uses: actions/checkout@v7
      - name: SketchUp 2017 Ruby compatibility guard
        # test/ is scanned too: those files are executed by the real Ruby
        # 2.2.4-p230 smoke lane (tools/run_ruby22_exact_source.sh), so a 2.2
        # incompatibility there fails CI just as hard as one in the shipped
        # extension -- but this guard used to look only at extracted/. That gap let a
        # receiver-form define_method reach main and turn the 2.2 job red.
        run: python3 tools/check_su2017_ruby_compat.py extracted/sketchup_ext test
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Syntax check all .rb files
        run: |
          find extracted/sketchup_ext -name '*.rb' | while read f; do
            ruby -c "$f" || exit 1
          done

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version consistency check
        run: |
          META_VER=$(grep -oP "VERSION = '\\K[^']+" extracted/sketchup_ext/bc_pdf_vector_importer/metadata.rb | head -n1)
          LOADER_VER=$(grep -oP "PLUGIN_VERSION\\s*=\\s*'\\K[^']+" extracted/sketchup_ext/bc_pdf_vector_importer.rb | head -n1)
          README_VER=$(grep -oP 'Version-\K[0-9.]+' README.md | head -n1)
          if [ -z "$META_VER" ] || [ -z "$LOADER_VER" ] || [ -z "$README_VER" ]; then
            echo "ERROR: Could not read version(s): metadata=$META_VER loader=$LOADER_VER readme=$README_VER"
            exit 1
          fi
          if [ "$META_VER" != "$README_VER" ] || [ "$LOADER_VER" != "$README_VER" ]; then
            echo "ERROR: Version mismatch metadata=$META_VER loader=$LOADER_VER readme=$README_VER"
            exit 1
          fi

  smoke:
    needs: ruby22-exact-parse
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["2.2.4-p230", "2.7", "3.0", "3.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        if: matrix.ruby-version != '2.2.4-p230'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      - name: Ruby 2.2.4-p230 syntax + smoke (SketchUp Make 2017 compatibility)
        if: matrix.ruby-version == '2.2.4-p230'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl zlib1g-dev libyaml-dev libffi-dev
          bash tools/run_ruby22_exact_source.sh --smoke

      - name: Ruby syntax check
        if: matrix.ruby-version != '2.2.4-p230'
        run: |
          set -e
          find extracted test -type f -name "*.rb" -print0 | xargs -0 -n1 ruby -c

      - name: Run smoke test
        if: matrix.ruby-version != '2.2.4-p230'
        run: |
          ruby test/smoke_test.rb
          ruby test/ruby22_compat_test.rb
          ruby test/import_health_test.rb
          ruby test/compatibility_report_test.rb
          ruby test/corpus_harness_test.rb
          ruby test/arc_fitter_test.rb
          ruby test/unit_parser_test.rb
          ruby test/mesh_text_width_fidelity_test.rb
          ruby test/condensed_text_width_regression_test.rb
          ruby test/all_modes_placement_contract_test.rb
          ruby test/textmode1_invariant_test.rb
          ruby test/rotated_run_merge_test.rb
          ruby test/geometry_builder_text_fallback_test.rb
          ruby test/cairo_glyph_source_test.rb
          ruby test/synthetic_public_corpus_test.rb

  poppler-prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Poppler PE prune lock (static-only evidence; R21-7/R21-8)
        run: python tools/test_prune_poppler_bundle.py -v
      - name: Poppler helper smoke (static-only visible-skip off Windows; R21-8)
        run: python tools/smoke_poppler_helpers.py

  source-only-build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Zero-ceremony release contract tests
        run: python tools/test_build_release.py -v
      - name: Release safety unit tests (R21-5)
        run: |
          python tools/test_release_safety.py
          python -m unittest tools.test_complete_github_release tools.test_skp_probe_lock_contract
          python tools/test_build_steel_shapes_release.py
      - name: Smoke the checked-in Windows Poppler helpers
        run: python tools/smoke_poppler_helpers.py --required
      - name: Validate release publication state
        run: python tools/check_release_publication.py
