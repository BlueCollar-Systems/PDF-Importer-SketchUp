name: auto-release

on:
  push:
    branches: [main, master]
    # Docs-only pushes do not mint a release (board Q-08-a / ANS-09-1).
    # Release-pipeline workflow edits under .github/ are NOT ignored: they must
    # rebuild --latest assets. The job if: guard skips chore: bump version to
    # commits, so there is no release loop.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "_archived/**"
      - "dist/_archived/**"
      - "dev_logs/**"
      - "steel_shapes/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release-plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      action: ${{ steps.plan.outputs.action }}
      tag: ${{ steps.plan.outputs.tag }}
      build_ref: ${{ steps.plan.outputs.build_ref }}
      release_target: ${{ steps.plan.outputs.release_target }}
      release_state: ${{ steps.plan.outputs.release_state }}
      release_id: ${{ steps.plan.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify current release control plane
        run: |
          python tools/test_release_safety.py
          python -m unittest tools.test_complete_github_release tools.test_workflow_release_identity_contract
      - name: Read committed version
        id: version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          loader = pathlib.Path("extracted/sketchup_ext/bc_pdf_vector_importer.rb")
          metadata = pathlib.Path("extracted/sketchup_ext/bc_pdf_vector_importer/metadata.rb")
          readme = pathlib.Path("README.md")
          loader_match = re.search(
              r"PLUGIN_VERSION\s*=\s*'(\d+\.\d+\.\d+)'",
              loader.read_text(encoding="utf-8"),
          )
          metadata_match = re.search(
              r"VERSION\s*=\s*'(\d+\.\d+\.\d+)'",
              metadata.read_text(encoding="utf-8"),
          )
          readme_match = re.search(
              r"Version-(\d+\.\d+\.\d+)-(?:green|blue)\.svg",
              readme.read_text(encoding="utf-8"),
          )
          if not loader_match:
              raise SystemExit("Could not read the committed SketchUp version")
          version = loader_match.group(1)
          if not metadata_match or metadata_match.group(1) != version:
              raise SystemExit("Loader and metadata versions differ")
          if not readme_match or readme_match.group(1) != version:
              raise SystemExit("Loader and README versions differ")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8", newline="\n"
          ) as handle:
              handle.write(f"version={version}\n")
          PY
      - name: Discover and plan immutable release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          TAG_SHA="$(git rev-list -n 1 "$TAG^{commit}" 2>/dev/null || true)"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$RUNNER_TEMP/release-pages.json"
          python - "$RUNNER_TEMP/release-pages.json" "$RUNNER_TEMP/releases.json" <<'PY'
          import json
          import pathlib
          import sys

          pages = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(pages, list) or any(not isinstance(page, list) for page in pages):
              raise SystemExit("Paginated release discovery did not return arrays")
          releases = [release for page in pages for release in page]
          pathlib.Path(sys.argv[2]).write_text(
              json.dumps(releases, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          DISCOVERY="$(python tools/release_safety.py discover-release \
            --releases-json "$RUNNER_TEMP/releases.json" --tag "$TAG")"
          RELEASE_STATE="$(printf '%s' "$DISCOVERY" | python -c 'import json,sys; print(json.load(sys.stdin)["release_state"])')"
          RELEASE_ID="$(printf '%s' "$DISCOVERY" | python -c 'import json,sys; print(json.load(sys.stdin)["release_id"])')"
          # A draft has no tag ref until it is published, so its immutable
          # source is its own recorded target commit; hand that to the planner.
          DRAFT_TARGET=""
          if [ "$RELEASE_STATE" = "draft" ] && [ -n "$RELEASE_ID" ]; then
            DRAFT_TARGET="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.target_commitish // ""')"
          fi
          python tools/release_safety.py plan-release \
            --version "${{ steps.version.outputs.version }}" \
            --head-sha "$GITHUB_SHA" \
            --tag-sha "$TAG_SHA" \
            --release-state "$RELEASE_STATE" \
            --draft-target-sha "$DRAFT_TARGET" \
            --github-output "$GITHUB_OUTPUT"
          echo "release_state=$RELEASE_STATE" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  ruby22-exact-parse:
    needs: release-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-plan.outputs.build_ref }}
      - name: Assert immutable release source
        run: test "$(git rev-parse HEAD)" = "${{ needs.release-plan.outputs.build_ref }}"
      - name: Install exact-Ruby source build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential curl
      - name: Exact Ruby 2.2.4-p230 parse gate — every shipped extension file
        run: bash tools/run_ruby22_exact_source.sh --parse

  source-only-build-windows:
    needs: [release-plan, ruby22-exact-parse]
    runs-on: windows-latest
    outputs:
      publication_ready: ${{ steps.publication.outputs.publication_ready }}
      rbz_sha256: ${{ steps.artifact_identity.outputs.rbz_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-plan.outputs.build_ref }}
      - name: Assert immutable release source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ needs.release-plan.outputs.build_ref }}"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Ruby for native decoder verification
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Execute native PNG decoder smoke and byte-equivalence gate
        run: ruby test/representation_fidelity_contract_test.rb --name "/native_(rgba_decoder_is_byte_and_visual_hash_equivalent_to_ruby|decoder_accelerates_opaque_rgb_page_verification)/"
      - name: Zero-ceremony release contract tests
        run: |
          python tools/test_build_release.py -v
          python -m unittest tools.test_poppler_runtime_contract tools.test_workflow_poppler_contract
      - name: Release safety unit tests (R21-5)
        run: |
          python tools/test_release_safety.py
          python -m unittest tools.test_complete_github_release tools.test_skp_probe_lock_contract
      - name: Smoke the checked-in Windows Poppler helpers
        run: python tools/smoke_poppler_helpers.py --required
      - name: Evaluate release publication gate
        id: publication
        run: python tools/check_release_publication.py
      - name: Build approved Windows release bytes
        if: steps.publication.outputs.publication_ready == 'true'
        run: python build_release.py --out "$env:RUNNER_TEMP\su-rbz"
      - name: Record Windows RBZ identity
        if: steps.publication.outputs.publication_ready == 'true'
        id: artifact_identity
        run: |
          $rbz = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\su-rbz" -Filter 'SketchUp-PDF-Importer_v*.rbz' -File)
          if ($rbz.Count -ne 1) {
            throw "Expected exactly one Windows-built RBZ, found $($rbz.Count)."
          }
          $sha256 = (Get-FileHash -LiteralPath $rbz[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "rbz_sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload approved Windows RBZ
        if: steps.publication.outputs.publication_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: approved-windows-rbz
          path: ${{ runner.temp }}\su-rbz\SketchUp-PDF-Importer_v*.rbz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [release-plan, ruby22-exact-parse, source-only-build-windows]
    if: "needs.source-only-build-windows.outputs.publication_ready == 'true' && !startsWith(github.event.head_commit.message, 'chore: bump version to') && !contains(github.event.head_commit.message, 'automation/version-bump') && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current release control plane
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # GITHUB_TOKEN always authenticates checkout; RELEASE_BUMP_TOKEN is used
          # only when pushing the version-bump commit past branch protection.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve current release control plane
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-control"
          cp tools/release_safety.py "$RUNNER_TEMP/release-control/release_safety.py"
          cp tools/complete_github_release.py "$RUNNER_TEMP/release-control/complete_github_release.py"

      - name: Checkout immutable release source
        run: |
          set -euo pipefail
          git checkout --detach "${{ needs.release-plan.outputs.build_ref }}"
          test "$(git rev-parse HEAD)" = "${{ needs.release-plan.outputs.build_ref }}"

      - name: Download approved Windows RBZ
        uses: actions/download-artifact@v8
        with:
          name: approved-windows-rbz
          path: approved-windows-rbz-download

      - name: Verify downloaded Windows RBZ identity
        run: |
          set -e
          RBZ_COUNT=$(find approved-windows-rbz-download -maxdepth 1 -type f -name 'SketchUp-PDF-Importer_v*.rbz' | wc -l)
          test "$RBZ_COUNT" -eq 1
          RBZ=$(find approved-windows-rbz-download -maxdepth 1 -type f -name 'SketchUp-PDF-Importer_v*.rbz')
          ACTUAL_SHA256=$(sha256sum "$RBZ" | cut -d' ' -f1)
          test "$ACTUAL_SHA256" = "${{ needs.source-only-build-windows.outputs.rbz_sha256 }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Run release gate tests
        run: |
          set -e
          python3 tools/check_su2017_ruby_compat.py extracted/sketchup_ext
          python3 tools/test_prune_poppler_bundle.py
          python3 tools/test_release_safety.py
          python3 -m unittest tools.test_poppler_runtime_contract tools.test_workflow_poppler_contract tools.test_complete_github_release tools.test_skp_probe_lock_contract
          find extracted/sketchup_ext test -type f -name "*.rb" -print0 | xargs -0 -n1 ruby -c
          ruby test/smoke_test.rb
          ruby test/ruby22_compat_test.rb
          ruby test/import_health_test.rb
          ruby test/dependency_resolver_test.rb
          ruby test/qa_report_test.rb
          ruby test/text_mode_routing_test.rb
          ruby test/mesh_text_scaling_test.rb
          ruby test/mesh_text_height_faithful_test.rb
          ruby test/mesh_text_width_fidelity_test.rb
          ruby test/condensed_text_width_regression_test.rb
          ruby test/all_modes_placement_contract_test.rb
          ruby test/open_gate_file_missing_salvage_test.rb
          ruby test/source_provenance_test.rb
          ruby test/textmode1_invariant_test.rb
          ruby test/rotated_run_merge_test.rb
          ruby test/geometry_builder_text_fallback_test.rb
          ruby test/synthetic_public_corpus_test.rb

      - name: Exact Ruby 2.2.4-p230 source-built parse and smoke gates
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl zlib1g-dev libyaml-dev libffi-dev
          bash tools/run_ruby22_exact_source.sh --smoke

      - name: Assert selected source version
        run: |
          python - <<'PY'
          import pathlib
          import re

          loader = pathlib.Path("extracted/sketchup_ext/bc_pdf_vector_importer.rb")
          metadata = pathlib.Path("extracted/sketchup_ext/bc_pdf_vector_importer/metadata.rb")
          readme = pathlib.Path("README.md")

          loader_text = loader.read_text(encoding="utf-8")
          loader_match = re.search(r"PLUGIN_VERSION\s*=\s*'(\d+\.\d+\.\d+)'", loader_text)
          metadata_match = re.search(
              r"VERSION\s*=\s*'(\d+\.\d+\.\d+)'",
              metadata.read_text(encoding="utf-8"),
          )
          readme_match = re.search(
              r"Version-(\d+\.\d+\.\d+)-(?:green|blue)\.svg",
              readme.read_text(encoding="utf-8"),
          )
          if not loader_match:
              raise SystemExit("Could not find PLUGIN_VERSION in extracted/sketchup_ext/bc_pdf_vector_importer.rb")
          version = loader_match.group(1)
          if not metadata_match or metadata_match.group(1) != version:
              raise SystemExit(f"Version mismatch: loader={version} metadata={metadata_match.group(1) if metadata_match else 'missing'}")
          if not readme_match or readme_match.group(1) != version:
              raise SystemExit(f"Version mismatch: loader={version} readme={readme_match.group(1) if readme_match else 'missing'}")

          expected = "${{ needs.release-plan.outputs.version }}"
          if version != expected:
              raise SystemExit(
                  f"Selected release source version mismatch: {version} != {expected}"
              )
          PY

      - name: Smoke RBZ structure
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          version = Path("extracted/sketchup_ext/bc_pdf_vector_importer.rb").read_text(
              encoding="utf-8"
          )
          import re
          match = re.search(r"PLUGIN_VERSION\s*=\s*'(\d+\.\d+\.\d+)'", version)
          if not match:
              raise SystemExit("Could not read PLUGIN_VERSION for RBZ smoke")
          expected = (
              Path("approved-windows-rbz-download")
              / f"SketchUp-PDF-Importer_v{match.group(1)}.rbz"
          )
          if not expected.is_file():
              raise SystemExit(f"Expected RBZ missing: {expected}")
          with zipfile.ZipFile(expected) as zf:
              names = set(zf.namelist())
          required = {
              "bc_pdf_vector_importer.rb",
              "bc_pdf_vector_importer/main.rb",
              "bc_pdf_vector_importer/metadata.rb",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"RBZ missing required files: {missing}")
          legacy_bin = sorted(
              name for name in names
              if name.startswith("bc_pdf_vector_importer/bin/")
          )
          if legacy_bin:
              raise SystemExit(
                  "RBZ contains forbidden legacy bin/ payload: "
                  + ", ".join(legacy_bin)
              )
          required_runtime = {
              "bc_pdf_vector_importer/poppler-runtime-manifest.json",
              "bc_pdf_vector_importer/Library/bin/pdftocairo.exe",
              "bc_pdf_vector_importer/Library/bin/pdftotext.exe",
              "bc_pdf_vector_importer/Library/bin/pdffonts.exe",
              "bc_pdf_vector_importer/native/png_rgba_decoder.exe",
              "bc_pdf_vector_importer/share/poppler/cidToUnicode/Adobe-GB1",
          }
          missing_runtime = sorted(required_runtime - names)
          if missing_runtime:
              raise SystemExit(
                  "RBZ missing required zero-ceremony Poppler runtime: "
                  + ", ".join(missing_runtime)
              )
          print(
              f"PASS: {expected.name} includes required extension files "
              "and zero-ceremony Poppler runtime"
          )
          PY

      - name: Complete or verify immutable release
        id: mint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTION="${{ needs.release-plan.outputs.action }}"
          TAG="${{ needs.release-plan.outputs.tag }}"
          RELEASE_ID="${{ needs.release-plan.outputs.release_id }}"
          RELEASE_TARGET="${{ needs.release-plan.outputs.release_target }}"
          CONTROL="$RUNNER_TEMP/release-control"
          RBZ="approved-windows-rbz-download/SketchUp-PDF-Importer_v${{ needs.release-plan.outputs.version }}.rbz"
          SOURCE_CHECKSUMS_INPUT="third_party/sources/SHA256SUMS.txt"
          SOURCE_CHECKSUMS="approved-windows-rbz-download/SOURCE_SHA256SUMS.txt"
          RELEASE_CHECKSUMS="approved-windows-rbz-download/SHA256SUMS.txt"
          RELEASE_NOTES="approved-windows-rbz-download/RELEASE_NOTES.md"
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          test -f "$SOURCE_CHECKSUMS_INPUT"
          ACTUAL_SHA256=$(sha256sum "$RBZ" | cut -d' ' -f1)
          printf '%s  %s\n' "$ACTUAL_SHA256" "$(basename "$RBZ")" > "$RELEASE_CHECKSUMS"
          cp "$SOURCE_CHECKSUMS_INPUT" "$SOURCE_CHECKSUMS"
          (
            cd "$(dirname "$RELEASE_CHECKSUMS")"
            sha256sum --check SHA256SUMS.txt
          )
          printf '%s\n\n%s\n' \
            "Automated release from immutable source commit $RELEASE_TARGET." \
            '**Install:** Download the RBZ below, then in SketchUp use Window > Extension Manager > Install Extension.' \
            > "$RELEASE_NOTES"

          if [ "$ACTION" = "verify_existing_release" ]; then
            test -n "$RELEASE_ID"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RELEASE_JSON"
            jq -e --arg tag "$TAG" --argjson id "$RELEASE_ID" \
              '.id == $id and .tag_name == $tag' "$RELEASE_JSON" >/dev/null
            jq -e '.draft == false' "$RELEASE_JSON" >/dev/null
            jq -e '.immutable == true' "$RELEASE_JSON" >/dev/null
            python "$CONTROL/release_safety.py" verify-release-assets \
              --release-json "$RELEASE_JSON" \
              --asset "$RBZ" \
              --asset "$RELEASE_CHECKSUMS" \
              --asset "$SOURCE_CHECKSUMS" \
              --output "$RUNNER_TEMP/verified-release-assets.json"
            # Re-resolve and peel the tag immediately before acceptance. This
            # closes a plan/verify race where the tag could be force-moved after
            # the upstream plan selected its immutable source commit.
            python "$CONTROL/complete_github_release.py" \
              --repo "$GITHUB_REPOSITORY" \
              --tag "$TAG" \
              --target "$RELEASE_TARGET" \
              --expected-release-id "$RELEASE_ID" \
              --title "$TAG — PDF Vector Importer for SketchUp" \
              --notes-file "$RELEASE_NOTES" \
              --latest \
              --asset "$RBZ" \
              --asset "$RELEASE_CHECKSUMS" \
              --asset "$SOURCE_CHECKSUMS"
            echo "completed=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "published_now=false" >> "$GITHUB_OUTPUT"
            echo "action=verified_existing_release" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published and its exact immutable assets were verified. Product commits after the tag require a version bump."
            python "$CONTROL/release_safety.py" audit-existing-tag \
              --repo "$GITHUB_REPOSITORY" \
              --tag "$TAG" \
              --before "${{ github.event.before }}" \
              --head "$GITHUB_SHA" \
              --session-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --mode release \
              --summary "$GITHUB_STEP_SUMMARY" \
              --warnings-file .release-safety/warnings.json
            exit 0
          fi

          EXPECTED_ID_ARGS=()
          if [ -n "$RELEASE_ID" ]; then
            EXPECTED_ID_ARGS=(--expected-release-id "$RELEASE_ID")
          fi
          python "$CONTROL/complete_github_release.py" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --target "$RELEASE_TARGET" \
            --title "$TAG — PDF Vector Importer for SketchUp" \
            --notes-file "$RELEASE_NOTES" \
            --latest \
            "${EXPECTED_ID_ARGS[@]}" \
            --asset "$RBZ" \
            --asset "$RELEASE_CHECKSUMS" \
            --asset "$SOURCE_CHECKSUMS"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            > "$RUNNER_TEMP/release-by-tag.json"
          POST_ID="$(jq -er '.id | select(type == "number" and . > 0)' "$RUNNER_TEMP/release-by-tag.json")"
          if [ -n "$RELEASE_ID" ]; then
            test "$POST_ID" = "$RELEASE_ID"
          fi
          for attempt in 1 2 3 4 5; do
            gh api "repos/${GITHUB_REPOSITORY}/releases/${POST_ID}" > "$RELEASE_JSON"
            if jq -e '.draft == false and .immutable == true' "$RELEASE_JSON" >/dev/null; then
              break
            fi
            sleep $((attempt * 2))
          done
          jq -e --arg tag "$TAG" --argjson id "$POST_ID" \
            '.id == $id and .tag_name == $tag' "$RELEASE_JSON" >/dev/null
          jq -e '.draft == false' "$RELEASE_JSON" >/dev/null
          jq -e '.immutable == true' "$RELEASE_JSON" >/dev/null
          python "$CONTROL/release_safety.py" verify-release-assets \
            --release-json "$RELEASE_JSON" \
            --asset "$RBZ" \
            --asset "$RELEASE_CHECKSUMS" \
            --asset "$SOURCE_CHECKSUMS" \
            --output "$RUNNER_TEMP/verified-published-assets.json"

      - name: Check website dispatch token secret
        if: steps.mint.outputs.published_now == 'true'
        id: website_dispatch_token
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -n "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch website release update
        if: steps.mint.outputs.published_now == 'true' && steps.website_dispatch_token.outputs.has_token == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
          script: |
            const tag = '${{ needs.release-plan.outputs.tag }}';
            const payload = {
              source_repo: context.repo.owner + '/' + context.repo.repo,
              source_event: 'auto-release',
              source_ref: context.ref,
              source_sha: context.sha,
              release_tag: tag,
              release_name: tag,
              release_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
            };

            await github.request('POST /repos/{owner}/{repo}/dispatches', {
              owner: 'BlueCollar-Systems',
              repo: 'BlueCollar-Website',
              event_type: 'product-release',
              client_payload: payload,
            });

            core.info('Dispatched product-release to BlueCollar-Website');

      - name: Warn when website dispatch token is missing
        if: steps.mint.outputs.published_now == 'true' && steps.website_dispatch_token.outputs.has_token != 'true'
        run: |
          echo "::warning::Skipping website dispatch because no valid dispatch token secret is configured."
          echo "Set WEBSITE_DISPATCH_TOKEN (or BLUECOLLAR_WEBSITE_DISPATCH_TOKEN / REPO_DISPATCH_TOKEN) to enable cross-repo dispatch."
