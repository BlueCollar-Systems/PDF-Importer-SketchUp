name: steel-shapes-release

on:
  push:
    tags:
      - "steel-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build deterministic privacy-checked shape pack
        id: pack
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#steel-}"
          ZIP_NAME="Structural-Steel-SU-Shapes-${VERSION}.zip"
          LATEST_ZIP="Structural-Steel-SU-Shapes-latest.zip"
          OUT="$RUNNER_TEMP/steel-shapes-release"
          python tools/build_steel_shapes_release.py \
            --tag "$GITHUB_REF_NAME" --source steel_shapes --out-dir "$OUT"
          echo "zip=$OUT/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "latest=$OUT/$LATEST_ZIP" >> "$GITHUB_OUTPUT"
          echo "checksums=$OUT/SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Publish exact non-product-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/steel-release-notes.md"
          printf '%s\n' 'Deterministic SketchUp structural-steel shape pack. Verify either ZIP with the release-bound SHA256SUMS.txt asset.' > "$NOTES"
          python tools/complete_github_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --title "Steel Shapes $GITHUB_REF_NAME" \
            --notes-file "$NOTES" \
            --asset "${{ steps.pack.outputs.zip }}" \
            --asset "${{ steps.pack.outputs.latest }}" \
            --asset "${{ steps.pack.outputs.checksums }}"
